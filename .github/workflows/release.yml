name: release

# The version is taken from the latest release tag (v<MAJOR.MINOR.PATCH>-...)
# and bumped by the chosen part; with no release tag yet, it starts from 0.0.0.
# The release label is <version>-svf-<SVF short commit>-llvm-<LLVM major>,
# for example 0.1.0-svf-a8a0f51-llvm-22. It names the Git tag (with a "v"),
# the GitHub release and the image tag. SVF and LLVM are read from the built
# image, so the label always describes what was actually built.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Part of the version to increase
        type: choice
        options: [major, minor, fix]
        default: fix
      svf_ref:
        description: SVF branch, tag or commit to build against
        default: master
      platforms:
        description: Space-separated image platforms
        default: linux/amd64 linux/arm64
      publish:
        description: Push the image and create the GitHub release (false = build and test only)
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 720
    env:
      BUMP: ${{ inputs.bump }}
      LOCAL: localhost/svf-ae-verifier-release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: check inputs
        shell: bash
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::release only from main (got $GITHUB_REF)"; exit 1
          fi
          # Assign first: a failure inside $(...) in an echo argument wouldn't fail the step.
          version="$(bash .github/scripts/release-version.sh "$BUMP")"
          sha="$(bash .github/scripts/resolve-svf-ref.sh "${{ inputs.svf_ref }}")"
          {
            echo "VERSION=$version"
            echo "SVF_SHA=$sha"
            echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}"
          } >> "$GITHUB_ENV"

      - name: build and test each platform
        shell: bash
        run: |
          # The build stage runs ctest; a failing test fails the release.
          bash .github/scripts/build-release-images.sh "$LOCAL" "$SVF_SHA" "$VERSION" "$GITHUB_SHA" \
            ${{ inputs.platforms }} | tail -3 >> "$GITHUB_ENV"

      - name: push image
        if: inputs.publish
        shell: bash
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          podman manifest rm "$IMAGE:$LABEL" 2>/dev/null || true
          podman manifest create "$IMAGE:$LABEL"
          for platform in ${{ inputs.platforms }}; do
            arch="${platform#linux/}"
            podman push "$LOCAL:$arch" "docker://$IMAGE:$LABEL-$arch"
            podman manifest add "$IMAGE:$LABEL" "docker://$IMAGE:$LABEL-$arch"
          done
          podman manifest push --all "$IMAGE:$LABEL" "docker://$IMAGE:$LABEL"
          podman manifest push --all "$IMAGE:$LABEL" "docker://$IMAGE:latest"

      - name: release notes
        shell: bash
        run: |
          cat > release-notes.md <<EOF
          Container image: \`$IMAGE:$LABEL\` (${{ inputs.platforms }})

          | Component | Version |
          |---|---|
          | svf-ae-verifier | $VERSION (\`$GITHUB_SHA\`) |
          | SVF | \`$BUILT_SVF_COMMIT\` |
          | LLVM | $BUILT_LLVM_VERSION |

          \`\`\`sh
          docker pull $IMAGE:$LABEL
          \`\`\`
          EOF
          cat release-notes.md

      - name: create release
        if: inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.LABEL }}
          target_commitish: ${{ github.sha }}
          name: v${{ env.LABEL }}
          body_path: release-notes.md
          files: schema/report.schema.json

      - name: remove images
        if: always()
        shell: bash
        run: |
          if [ -n "${LABEL:-}" ]; then
            podman manifest rm "$IMAGE:$LABEL" 2>/dev/null || true
          fi
          for platform in ${{ inputs.platforms }}; do
            podman rmi -f "$LOCAL:${platform#linux/}" || true
          done
