name: release

# The release label is <version>-svf-<SVF short commit>-llvm-<LLVM major>,
# for example 0.1.0-svf-a8a0f51-llvm-22. It names the Git tag (with a "v"),
# the GitHub release and the image tag. SVF and LLVM are read from the built
# image, so the label always describes what was actually built.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, without "v". Must equal project(VERSION) in CMakeLists.txt.
        required: true
      svf_ref:
        description: SVF branch, tag or commit to build against
        default: master
      platforms:
        description: Space-separated image platforms
        default: linux/amd64 linux/arm64
      publish:
        description: Push the image and create the GitHub release (false = build and test only)
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 720
    env:
      VERSION: ${{ inputs.version }}
      LOCAL: localhost/svf-ae-verifier-release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: check inputs
        shell: bash
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::release only from main (got $GITHUB_REF)"; exit 1
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be MAJOR.MINOR.PATCH (got $VERSION)"; exit 1
          fi
          cmake_version="$(sed -nE 's/^project\(svf-ae-verifier VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)"
          if [ "$cmake_version" != "$VERSION" ]; then
            echo "::error::CMakeLists.txt has version $cmake_version, not $VERSION"; exit 1
          fi
          sha="$(git ls-remote https://github.com/SVF-tools/SVF.git "${{ inputs.svf_ref }}" | head -1 | cut -f1)"
          if [ -z "$sha" ]; then
            # Not a branch or tag name: treat it as a commit.
            sha="${{ inputs.svf_ref }}"
          fi
          echo "SVF_SHA=$sha" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: build and test each platform
        shell: bash
        run: |
          for platform in ${{ inputs.platforms }}; do
            arch="${platform#linux/}"
            echo "::group::build $platform"
            # The build stage runs ctest; a failing test fails the release.
            podman build --platform "$platform" \
              --build-arg "SVF_REF=$SVF_SHA" \
              --build-arg "VERIFIER_GIT_COMMIT=$GITHUB_SHA" \
              -t "$LOCAL:$arch" .
            echo "::endgroup::"
            echo "::group::smoke test $platform"
            bash .github/scripts/smoke-test.sh "$LOCAL:$arch" "$platform"
            echo "::endgroup::"
          done

      - name: release label
        shell: bash
        run: |
          svf="" llvm=""
          for platform in ${{ inputs.platforms }}; do
            image="$LOCAL:${platform#linux/}"
            s="$(podman run --rm --platform "$platform" "$image" cat /opt/svf/SVF_COMMIT)"
            l="$(podman run --rm --platform "$platform" "$image" cat /opt/svf/LLVM_VERSION)"
            if [ -n "$svf" ] && { [ "$s" != "$svf" ] || [ "$l" != "$llvm" ]; }; then
              echo "::error::platforms differ: SVF $svf/$s, LLVM $llvm/$l"; exit 1
            fi
            svf="$s" llvm="$l"
          done
          label="$VERSION-svf-${svf:0:7}-llvm-${llvm%%.*}"
          if git rev-parse -q --verify "refs/tags/v$label" > /dev/null; then
            echo "::error::tag v$label already exists"; exit 1
          fi
          {
            echo "LABEL=$label"
            echo "BUILT_SVF_COMMIT=$svf"
            echo "BUILT_LLVM_VERSION=$llvm"
          } >> "$GITHUB_ENV"
          echo "release label: $label"

      - name: push image
        if: inputs.publish
        shell: bash
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          podman manifest rm "$IMAGE:$LABEL" 2>/dev/null || true
          podman manifest create "$IMAGE:$LABEL"
          for platform in ${{ inputs.platforms }}; do
            arch="${platform#linux/}"
            podman push "$LOCAL:$arch" "docker://$IMAGE:$LABEL-$arch"
            podman manifest add "$IMAGE:$LABEL" "docker://$IMAGE:$LABEL-$arch"
          done
          podman manifest push --all "$IMAGE:$LABEL" "docker://$IMAGE:$LABEL"
          podman manifest push --all "$IMAGE:$LABEL" "docker://$IMAGE:latest"

      - name: release notes
        shell: bash
        run: |
          cat > release-notes.md <<EOF
          Container image: \`$IMAGE:$LABEL\` (${{ inputs.platforms }})

          | Component | Version |
          |---|---|
          | svf-ae-verifier | $VERSION (\`$GITHUB_SHA\`) |
          | SVF | \`$BUILT_SVF_COMMIT\` |
          | LLVM | $BUILT_LLVM_VERSION |

          \`\`\`sh
          docker pull $IMAGE:$LABEL
          \`\`\`
          EOF
          cat release-notes.md

      - name: create release
        if: inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.LABEL }}
          target_commitish: ${{ github.sha }}
          name: v${{ env.LABEL }}
          body_path: release-notes.md
          files: schema/report.schema.json

      - name: remove images
        if: always()
        shell: bash
        run: |
          if [ -n "${LABEL:-}" ]; then
            podman manifest rm "$IMAGE:$LABEL" 2>/dev/null || true
          fi
          for platform in ${{ inputs.platforms }}; do
            podman rmi -f "$LOCAL:${platform#linux/}" || true
          done
